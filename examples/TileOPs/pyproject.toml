[project]
name = "TileOPs"
version = "0.1.0"
description = "Standalone NPU benchmark framework extracted from TileOPs."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "ruff",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tileops*"]

[tool.setuptools.package-data]
tileops = ["manifest/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchmarks"]
python_files = ["test_*.py", "bench_*.py"]
markers = [
    "smoke: fast critical-path tests",
    "full: standard correctness coverage",
    "nightly: exhaustive or long-running coverage",
    "packaging: minimal install sanity check",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "I", "N", "RUF022"]
ignore = [
    "E741",
    "E501",
    "SIM118",
    "B019",
    "E902",
    "N812",
    "N801",
    "N802",
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
# Auto-generated extracted kernel files: align_up is injected at runtime,
# and the extraction script's import ordering (incl. duplicate imports from
# multiple contributing source files) is not ruff-controlled.
"tileops/kernels/**/_*_kernels.py" = ["F401", "F811", "F821", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["tileops", "workloads"]
