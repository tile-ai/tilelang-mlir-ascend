<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-label="图2  为什么选择 L0 tile = 256×256×64"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#56657a"/></marker></defs><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}</style><rect width="1400" height="700" fill="#f8fafc"/><text x="36" y="56" font-size="34" fill="#16243b" font-weight="700" text-anchor="start">图2  为什么选择 L0 tile = 256×256×64</text><text x="36" y="98" font-size="23" fill="#56657a" font-weight="400" text-anchor="start">BF16=2 字节，FP32=4 字节；条宽按字节比例绘制，各行属于独立存储空间。</text><text x="48" y="232" font-size="30" fill="#2369c6" font-weight="700" text-anchor="start">L0A</text><rect x="320" y="190" width="96" height="68" rx="7" fill="#eaf2ff" stroke="#2369c6" stroke-width="2"/><text x="368" y="219" font-size="20" fill="#2369c6" font-weight="700" text-anchor="middle">槽 0</text><text x="368" y="245" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">32 KiB</text><rect x="416" y="190" width="96" height="68" rx="7" fill="#eaf2ff" stroke="#2369c6" stroke-width="2"/><text x="464" y="219" font-size="20" fill="#2369c6" font-weight="700" text-anchor="middle">槽 1</text><text x="464" y="245" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">32 KiB</text><text x="555" y="218" font-size="24" fill="#16243b" font-weight="700" text-anchor="start">256 × 64 × 2 B × 2 槽 = 64 KiB</text><text x="555" y="249" font-size="21" fill="#56657a" font-weight="400" text-anchor="start">双缓冲：每槽预算 32 KiB</text><text x="48" y="352" font-size="30" fill="#147d64" font-weight="700" text-anchor="start">L0B</text><rect x="320" y="310" width="96" height="68" rx="7" fill="#e4f5ee" stroke="#147d64" stroke-width="2"/><text x="368" y="339" font-size="20" fill="#147d64" font-weight="700" text-anchor="middle">槽 0</text><text x="368" y="365" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">32 KiB</text><rect x="416" y="310" width="96" height="68" rx="7" fill="#e4f5ee" stroke="#147d64" stroke-width="2"/><text x="464" y="339" font-size="20" fill="#147d64" font-weight="700" text-anchor="middle">槽 1</text><text x="464" y="365" font-size="18" fill="#16243b" font-weight="400" text-anchor="middle">32 KiB</text><text x="555" y="338" font-size="24" fill="#16243b" font-weight="700" text-anchor="start">256 × 64 × 2 B × 2 槽 = 64 KiB</text><text x="555" y="369" font-size="21" fill="#56657a" font-weight="400" text-anchor="start">双缓冲：每槽预算 32 KiB</text><text x="48" y="472" font-size="30" fill="#c46a13" font-weight="700" text-anchor="start">L0C</text><rect x="320" y="430" width="768" height="80" rx="8" fill="#fff2dd" stroke="#c46a13" stroke-width="2"/><text x="704" y="466" font-size="24" fill="#c46a13" font-weight="700" text-anchor="middle">单个 256 × 256 FP32 累加块</text><text x="704" y="496" font-size="22" fill="#16243b" font-weight="400" text-anchor="middle">256 × 256 × 4 B = 256 KiB</text><rect x="36" y="555" width="1328" height="104" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="60" y="592" font-size="25" fill="#16243b" font-weight="700" text-anchor="start">tile 选择的容量推导</text><text x="60" y="631" font-size="23" fill="#56657a" font-weight="400" text-anchor="start">K_tile ≤ 32 KiB / (256 × 2 B) = 64；L1 A/B 各两槽，总占用 512 KiB。</text></svg>
