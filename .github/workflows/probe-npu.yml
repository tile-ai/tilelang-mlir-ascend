name: Probe NPU Runtime

on:
  push:
    branches: [probe-ci]
  workflow_dispatch:

jobs:
  probe:
    runs-on: linux-aarch64-a3-800i-2
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.5.0-a3-ubuntu22.04-py3.11
    timeout-minutes: 30
    env:
      UV_SYSTEM_PYTHON: 1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    - name: Download arm64 wheel from green run
      uses: actions/download-artifact@v4
      with:
        name: tilelang-npuir-py3.11-arm64
        path: dist/
        run-id: 40074875901
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install
      run: |
        CACHING_URL="cache-service.nginx-pypi-cache.svc.cluster.local"
        sed -Ei "s@(ports|archive).ubuntu.com@${CACHING_URL}:8081@g" /etc/apt/sources.list
        pip config set global.index-url http://${CACHING_URL}/pypi/simple
        pip config set global.trusted-host "${CACHING_URL}"
        pip install uv
        uv pip install torch==2.7.1 torch-npu==2.7.1 pyyaml pybind11
        uv pip install dist/tilelang*.whl


    - name: Install clang
      run: |
        apt-get update && apt-get install -y clang

    - name: Probe torch_npu
      env:
        TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      run: |
        python - <<'PY'
        import os
        print("before torch")
        import torch
        print("torch", torch.__version__)
        try:
            import torch_npu
            print("torch_npu", torch_npu.__version__)
            print("device_count", torch.npu.device_count())
            print("is_available", torch.npu.is_available())
        except Exception as exc:
            import traceback
            traceback.print_exc()
        PY

    - name: Probe npu_utils
      env:
        TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      run: |
        cd /tmp
        SITE=$(python -c "import tilelang, os; print(os.path.dirname(tilelang.__file__))")
        cp "$GITHUB_WORKSPACE/tilelang/utils/npu_utils.cpp" "$SITE/utils/"
        cp "$GITHUB_WORKSPACE/tilelang/utils/npu_utils.py" "$SITE/utils/"
        python - <<'PY'
        import torch_npu
        from tilelang.utils.npu_utils import NPUUtils
        print("device_num", NPUUtils.get().get_device_num())
        print("arch", NPUUtils.get().get_arch())
        print("aicore", NPUUtils.get().get_aicore_num())
        PY

    - name: Probe real kernel launch
      env:
        TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      run: |
        cd /tmp
        SITE=$(python -c "import tilelang, os; print(os.path.dirname(tilelang.__file__))")
        cp "$GITHUB_WORKSPACE/tilelang/ascend910/adapter.py" "$SITE/ascend910/"
        cp "$GITHUB_WORKSPACE/tilelang/jit/kernel.py" "$SITE/jit/"
        cp "$GITHUB_WORKSPACE/tilelang/utils/tensor.py" "$SITE/utils/"
        cp "$GITHUB_WORKSPACE/tilelang/profiler/__init__.py" "$SITE/profiler/"
        cp "$GITHUB_WORKSPACE/tilelang/utils/npu_utils.cpp" "$SITE/utils/"
        cp "$GITHUB_WORKSPACE/tilelang/utils/npu_utils.py" "$SITE/utils/"
        cd /tmp
        export TILELANG_EXAMPLES="$GITHUB_WORKSPACE/examples/elementwise"
        cp "$GITHUB_WORKSPACE/runtime_probe.py" /tmp/runtime_probe.py
        python /tmp/runtime_probe.py

    - name: Probe more kernels
      env:
        TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      run: |
        cd /tmp
        for ex in examples/elementwise/vec_add_1d.py examples/elementwise/vec_add_2d.py examples/gemm/matmul.py; do
          echo "=== $ex ==="
          python - "$GITHUB_WORKSPACE/$ex" <<'PY'
        import runpy
        import sys
        path = sys.argv[1]
        sys.argv = [path]
        runpy.run_path(path, run_name="__main__")
        PY
        done

    - name: Probe autotune
      if: always()
      env:
        TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
      run: |
        cd /tmp
        cp "$GITHUB_WORKSPACE/autotune_probe.py" /tmp/autotune_probe.py
        python /tmp/autotune_probe.py
    - name: Show autotuner log
      if: always()
      run: cat /tmp/autotuner.log || true
