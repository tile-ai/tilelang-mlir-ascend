name: Build TileLang Wheel

on:
  workflow_call:
    inputs:
      npuir-commit:
        description: "AscendNPU-IR commit hash (from prebuild)"
        type: string
        required: true
      tvm-commit:
        description: "TVM submodule commit hash (from prebuild)"
        type: string
        required: true
      checkout-ref:
        description: "Git ref to checkout"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      checkout-ref:
        description: "Git ref to checkout (leave empty for default)"
        type: string
        default: ''

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  NPUIR_INSTALL_DIR: npuir-prebuild
  TVM_INSTALL_DIR: tvm-prebuild

jobs:
  build-wheel:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.checkout-ref || '' }}
        fetch-depth: 1
        submodules: false

    - name: Initialize submodules
      run: |
        git submodule update --init --recursive 3rdparty/tvm
        mkdir -p 3rdparty/composable_kernel/include
        mkdir -p 3rdparty/composable_kernel/library

    - name: Restore NPUIR prebuild from cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.NPUIR_INSTALL_DIR }}
        key: npuir-prebuild-rtti-${{ matrix.arch }}-${{ inputs.npuir-commit }}
        fail-on-cache-miss: true

    - name: Restore TVM prebuild from cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.TVM_INSTALL_DIR }}
        key: tvm-prebuild-isolated-v1-${{ matrix.arch }}-${{ inputs.tvm-commit }}
        fail-on-cache-miss: true

    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake make libzstd-dev zlib1g-dev patchelf
        pip install -r requirements-build.txt
        pip install lit

    - name: Build wheel with pip
      env:
        USE_NPUIR: "true"
        BISHENGIR_PATH: ${{ github.workspace }}/npuir-prebuild
        TVM_PREBUILD_PATH: ${{ github.workspace }}/tvm-prebuild
      run: |
        python -m pip install --upgrade pip build
        python -m pip wheel . -v -w dist --no-deps \
          -C cmake.define.USE_NPUIR=ON \
          -C cmake.define.BISHENGIR_ROOT_PATH=${BISHENGIR_PATH} \
          -C cmake.define.TVM_PREBUILD_PATH=${TVM_PREBUILD_PATH} \
          -C cmake.define.USE_CUDA=OFF \
          -C cmake.define.USE_ROCM=OFF

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: tilelang-npuir-py${{ env.PYTHON_VERSION }}-${{ matrix.arch }}
        path: dist/*.whl
        retention-days: 30
